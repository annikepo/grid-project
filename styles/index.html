<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Color Palette</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <main class="palette">
    <!-- Top-Left Large Box -->
    <div class="color color-1">
      <img src="../images/fox-1.jpg" alt="A red fox sleeping on a wooden deck.">
    </div>

    <!-- Bottom-Left Medium Box -->
    <div class="color color-2">
      <img src="../images/fox-2.jpg" alt="Two bat-eared foxes resting together in red sand.">
    </div>

    <!-- Middle Tall Box -->
    <div class="color color-3">
      <img src="../images/fox-3.jpg" alt="A red fox standing with its front paws on a large rock.">
    </div>

    <!-- Small Top-Right Strip 1 (Empty Color Block) -->
    <div class="color color-4"></div>

    <!-- Small Top-Right Strip 2 (Empty Color Block) -->
    <div class="color color-5"></div>

    <!-- Large Right Block (Moved Image Here) -->
    <div class="color color-6">
      <img src="../images/fox-4.jpg" alt="A red fox sleeping curled up on a tree stump.">
    </div>

    <!-- Bottom Blocks -->
    <div class="color color-7"></div>
    <div class="color color-8"></div>
    <div class="color color-9"></div>

    <!-- Large Bottom-Center Block (Moved Image Here) -->
    <div class="color color-10">
      <img src="../images/fox-5.jpg" alt="Two red foxes play-fighting in the snow.">
    </div>

    <div class="color color-11"></div>
  </main>
</body>
</html>
